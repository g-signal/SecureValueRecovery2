name: Build and push to Docker Hub2

on:
  release:
    types: [published]
  workflow_dispatch:  # 支持手动触发
    inputs:
      tag:
        description: 'Docker tag to use (defaults to branch name)'
        required: false
        default: ''

env:
  DOCKER_BUILD_ARGS: --cache-from type=gha --cache-to type=gha
  DOCKER_BUILDKIT: 1
  BUILDX_CONTAINER: container
  V: 1
  MAKE_ARGS: GOFLAGS=-buildvcs=false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout

    steps:
      - name: Checkout main project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          lfs: true

      - name: Set docker tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "DOCKER_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "DOCKER_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Show releases
        run: find enclave/releases -ls

      - name: Expose Docker environmental variables for gha cache
        # This action takes in the ID tokens etc provided by the permissions,
        # as well as some environmental data, and exposes them to future steps
        # in the correct locations and formats for their use with the `gha`
        # GitHub Actions cache for Docker.
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Setup Docker
        run: docker buildx create --use --name container --driver docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      - name: Clear some disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build binaries
        run: |
          make docker_enclave_test || make DOCKER_MAKE_ARGS=-j1 docker_enclave_test
          make || make DOCKER_MAKE_ARGS=-j1

      - name: Build and push to Docker Hub
        run: |
          make enclave_release

          # SGX Runtime 镜像
          docker tag svr2_sgxrun:latest ${{ secrets.DOCKERHUB_USERNAME }}/svr2-sgx:${DOCKER_TAG}
          docker tag svr2_sgxrun:latest ${{ secrets.DOCKERHUB_USERNAME }}/svr2-sgx:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/svr2-sgx:${DOCKER_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/svr2-sgx:latest

          # Nitro Host 镜像
          docker tag svr2_nsmhost:latest ${{ secrets.DOCKERHUB_USERNAME }}/svr2-nitro:${DOCKER_TAG}
          docker tag svr2_nsmhost:latest ${{ secrets.DOCKERHUB_USERNAME }}/svr2-nitro:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/svr2-nitro:${DOCKER_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/svr2-nitro:latest

      - name: Show built MRENCLAVE values
        run: |
          echo "Built enclave files with MRENCLAVE:"
          find enclave/releases/sgx -name "Standard_DC*" -type f | while read file; do
            mrenclave=$(basename "$file" | cut -d'.' -f2)
            echo "  $(basename "$file"): $mrenclave"
          done
